<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Attendance Logger</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d9e1ea;--brand:#0f4c5c;--bad:#b42318;--ok:#14804a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}.app{max-width:560px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.title{font-size:20px;font-weight:800}.sub,.hint{font-size:12px;color:var(--muted)}.badge{font-size:11px;font-weight:800;border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px}.card{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.video{position:relative;background:#000;border-radius:14px;overflow:hidden;height:54vh;min-height:320px}.video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.branch{position:absolute;right:10px;top:10px;background:rgba(15,76,92,.9);color:white;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}.row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:var(--brand);color:#fff}.secondary{background:#eef4f6;color:var(--brand)}.msg{margin-top:10px;font-size:12px;min-height:18px}.bad{color:var(--bad)}.ok{color:var(--ok)}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:16px;padding:18px;width:min(420px,100%)}.modal h3{margin:0 0 8px}.modal label{display:block;font-size:11px;font-weight:800;margin-top:12px;margin-bottom:5px}.loading{position:fixed;inset:0;background:rgba(255,255,255,.62);display:none;align-items:center;justify-content:center;z-index:30}.loading div{background:white;border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-weight:800}
</style>
</head>
<body>
<div class="loading" id="loading"><div id="loadingText">Loading…</div></div>
<div class="overlay" id="activate"><div class="modal"><h3>Activate Logger Device</h3><div class="hint">Enter the activation code generated by the administrator.</div><label>Device Name</label><input id="deviceLabel" placeholder="e.g. Front Desk Phone"><label>Activation Code</label><input id="activationCode" inputmode="numeric" maxlength="6" placeholder="6-digit code"><div class="row"><button onclick="activateDevice()">Activate</button></div><div class="msg" id="activateMsg"></div></div></div>
<div class="app">
  <div class="head"><div><div class="title">Attendance Logger</div><div class="sub" id="loggerName">Connecting…</div></div><div class="badge">Web Logger v1</div></div>
  <div class="card">
    <div class="video"><video id="video" autoplay playsinline muted></video><div class="branch" id="branch">Branch: —</div></div>
    <div class="row"><input id="employeeId" autocomplete="off" placeholder="Employee ID" onkeydown="if(event.key==='Enter')record('PHOTO')"><button onclick="record('PHOTO')">Photo</button></div>
    <div class="row"><button class="secondary" onclick="record('MANUAL')">Employee ID Only</button></div>
    <div class="msg" id="msg"></div>
    <div class="hint">TIME IN / TIME OUT is selected automatically. Photo mode captures a camera image; ID Only follows logger authorization.</div>
  </div>
</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const qs=new URLSearchParams(location.search);
const TOKEN=qs.get('token')||'';
const KEY_NAME='APS_PUBLIC_LOGGER_DEVICE_KEY';
let DEVICE_KEY=localStorage.getItem(KEY_NAME)||'';
let CONFIG=null,STREAM=null,BUSY=false;
if(!DEVICE_KEY){DEVICE_KEY=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.setItem(KEY_NAME,DEVICE_KEY)}
const q=id=>document.getElementById(id);
function msg(t,bad){q('msg').textContent=t||'';q('msg').className='msg '+(bad?'bad':'ok')}
function loading(on,t){q('loadingText').textContent=t||'Loading…';q('loading').style.display=on?'flex':'none'}
async function api(action,payload={}){
  const r=await fetch('/api/logger',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token:TOKEN,deviceKey:DEVICE_KEY,...payload})});
  const j=await r.json().catch(()=>({ok:false,message:'Invalid server response.'}));
  if(!r.ok||j.ok===false)throw new Error(j.message||'Request failed.');
  return j;
}
async function startCamera(){
  try{STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:720}},audio:false});q('video').srcObject=STREAM}
  catch(e){msg('Camera unavailable. Allow camera permission or use Employee ID Only.',true)}
}
function capture(){
  if(!STREAM)throw new Error('Camera is not ready.');
  const v=q('video'),c=q('canvas'),max=520,s=Math.min(1,max/(v.videoWidth||720),max/(v.videoHeight||960));
  c.width=Math.max(1,Math.round((v.videoWidth||720)*s));c.height=Math.max(1,Math.round((v.videoHeight||960)*s));
  const x=c.getContext('2d');x.save();x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height);x.restore();
  return c.toDataURL('image/jpeg',.52);
}
async function boot(){
  if(!TOKEN){msg('Logger token is missing.',true);return}
  loading(true,'Connecting logger…');
  try{
    const r=await api('status');
    CONFIG=r.config||{};
    q('loggerName').textContent=CONFIG.loggerName||'Attendance Logger';
    q('branch').textContent='Branch: '+(CONFIG.branch||'Unassigned');
    if(r.status!=='Registered')q('activate').style.display='flex';
  }catch(e){msg(e.message,true)}
  finally{loading(false)}
  startCamera();
}
async function activateDevice(){
  q('activateMsg').textContent='Activating…';
  try{
    const r=await api('activate',{activationCode:q('activationCode').value,deviceLabel:q('deviceLabel').value,browserInfo:navigator.userAgent});
    CONFIG=r.config||CONFIG;q('activate').style.display='none';msg('Device activated.','');
  }catch(e){q('activateMsg').textContent=e.message;q('activateMsg').className='msg bad'}
}
async function record(mode){
  if(BUSY)return;
  const employeeId=q('employeeId').value.trim();
  if(!employeeId)return msg('Enter Employee ID.',true);
  if(mode==='MANUAL'&&CONFIG&&CONFIG.manualIdAllowed===false)return msg('Employee ID Only is disabled for this logger.',true);
  if(mode==='PHOTO'&&CONFIG&&CONFIG.cameraRequired===false)return msg('Photo Attendance is disabled for this logger.',true);
  BUSY=true;loading(true,'Checking attendance…');
  try{
    const l=await api('lookup',{employeeId});
    const punch=String(l.requiredPunch||l.suggestedPunch||'').toUpperCase();
    if(punch==='COMPLETE')throw new Error('Attendance is already complete for today.');
    if(punch!=='IN'&&punch!=='OUT')throw new Error('Unable to determine TIME IN / TIME OUT.');
    loading(true,'Saving '+punch+'…');
    const photoDataUrl=mode==='PHOTO'?capture():'';
    const r=await api('submit',{employeeId,punch,photoDataUrl,inputMethod:'MANUAL_ID',attendanceMethod:mode==='PHOTO'?'PHOTO':'MANUAL'});
    msg('✓ '+r.punch+' RECORDED · '+r.employeeName+' · '+r.timestamp,false);q('employeeId').value='';
  }catch(e){msg(e.message,true)}
  finally{BUSY=false;loading(false)}
}
boot();
</script>
</body>
</html>
